[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bettercheck"
version = "0.0.1"
description = "A CLI tool that helps evaluate Python packages for security concerns"
readme = "README.md"
authors = [{ name = "Jason Pickup", email = "therayking99@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["security", "package", "dependency", "check", "vulnerability", "supply-chain"]
dependencies = [
    "requests>=2.32.0",
    "click>=8.1.0",
    "packaging>=24.0",
    "pygithub>=2.3.0",
    "pypistats>=1.6.0",
    "jsonschema>=4.23.0",
    "aiohttp>=3.9.0",
    "matplotlib>=3.8.0",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/rayking99/bettercheck"
Repository = "https://github.com/rayking99/bettercheck.git"

[project.scripts]
bettercheck-yourself = "bettercheck.check_yourself:main"
bettercheck = "bettercheck.cli:main"
bettercheck-deps = "bettercheck.dep_tree:main"
bettercheck-scan = "bettercheck.scanner:main"
bettercheck-recursive = "bettercheck.recursive:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "twine>=5.0.0",
    "build>=1.0.0",
    "vcrpy>=6.0.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bettercheck"]

[tool.pytest.ini_options]
addopts = "-v --cov=src/bettercheck --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py39"]